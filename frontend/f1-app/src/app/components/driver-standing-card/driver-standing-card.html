@if(item){
  <article (click)="selectItem()" [class.selected]="selected">
    <p id="standing-position">
      {{position}}
    </p>

    @if('acronym' in item){   <!-- Driver -->
      <p id="standing-name">
        {{item.name}}
      </p>
    } @else {   <!-- Team -->
      <p id="standing-name">
        {{getTeamName(item)}}
      </p>
    }

    @if('acronym' in item){
      <p id="standing-number">
        Nº-{{getNumber(item)}}
      </p>
    }

    <p id="standing-points">
      {{ points }}
    </p>

  </article>
}
