@if(item){
  <article (click)="selectItem()" [class.selected]="selected">
    <p id="standing-position">
      {{position}}
    </p>

    <p id="standing-name">
      {{item.name}}
    </p>

    @if('driverNumber' in item){
      <p id="standing-number">
        Nº-{{item.driverNumber}}
      </p>
    }

    <p id="standing-points">
      {{ points }}
    </p>

  </article>
}
