<div id="schedule-container">
  <section id="events-list">
    <h1 class="fancy">Season Calendar</h1>
    @for(event of events(); track event.id){
      <app-event-card
        [event]="event"
        [id]="'event-' + event.id">
      </app-event-card>
    }
  </section>

  <app-week-calendar
    [weeks]="weeks"
    (eventSelected)="scrollToEvent($event)"
  >
  </app-week-calendar>
</div>
